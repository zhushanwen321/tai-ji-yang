# opendesign-design-mode 的 bundle 声明：两行 insert——本包 host 半主行 + 设计模式 preset 行。
#
# preset 行的 config.plugins 是显式子插件组合（DSH preset 无隐式工具基线，全部子插件逐项
# 声明，形态对齐 DSH 仓 packages/bundle/web-app/presets/standard.patch.yml；agent-preset 的
# config schema（id/name/description/order/plugins）以 0.1.7 与 0.2.x 包内 lib 实读核对，
# 双版本一致）。八项声明：
#   本包四子插件（本包内声明形态 = name 用本包 exports 子路径说明符，宿主 loader 按 ESM
#   说明符解析到 lib/ 下对应入口）：
#     persona（系统提示词注入 + 启动资产探测，探测失败抛 diagnostic → preset broken）
#     /opendesign-doctor 诊断命令 / 设计面板 client / 产物伺服 host
#   DSH 原生四工具（包名为 DSH 仓 standard.patch.yml 实名）：tool-fs / tool-bash /
#     tool-web（fetch 能力，web-clone 档读目标页面所需）/ tool-present（交付声明与卡片链路）
#
# 用户在 Web 编辑器保存的编辑按行 id 覆盖本文件行（与 standard preset 同语义）。
- insert:
    # 本包 host 半主行：包级装配入口（lib/index.js）。preset 组合的挂载由上面 preset 行的
    # @deepseek-ai/dsh-agent-preset 完成，本行只承载包级生命周期与跨子插件协调。
    - id: opendesign-design-mode
      name: opendesign-design-mode

    # 设计模式 preset：新会话选择器出现「OpenDesign 设计模式」入口（custom 分组）。
    - id: preset-opendesign
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: opendesign
        name: OpenDesign 设计模式
        description: 以本机 OpenDesign 资产驱动的设计会话：发现→计划→生产产出八类 HTML 文件产物（原型/演示稿/文档/营销源码/动效源码/HyperFrames/网页复刻/webgl），右侧栏设计面板直接预览；图片/视频/音频成片生成不在 V1 范围（会如实说明并以 HTML 源码替代）；演示稿为普通单文件 HTML 预览（OD 协议级翻页/打印为后续版本）；未装 OpenDesign 时入口显式降级提示。
        order: 50
        plugins:
          # ── 本包子插件（name = 本包 exports 子路径）──────────────────────────
          - id: od-persona
            name: opendesign-design-mode/persona
          - id: od-doctor
            name: opendesign-design-mode/commands/doctor
          - id: od-serve
            name: opendesign-design-mode/serve/artifacts-route
          # 设计面板 client 在 preset 组合内的 host 侧行：宿主 loader 装载的是 host 侧占位
          # 入口（lib/client-entry.js）——面板 bundle 本体（lib/client.js）由上面主行驱动装载
          # （宿主 client-modules 按行名解析包 manifest → dsh.client → exports ./client；
          # 子路径说明符不构成 client row，且浏览器 bundle 顶层引用 window 不能进 host 装载）。
          - id: od-client
            name: opendesign-design-mode/client-entry
          # ── DSH 原生工具集（显式声明，包名 = standard preset 实名）────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              applyPatch: false
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
          - id: present
            name: '@deepseek-ai/dsh-tool-present'

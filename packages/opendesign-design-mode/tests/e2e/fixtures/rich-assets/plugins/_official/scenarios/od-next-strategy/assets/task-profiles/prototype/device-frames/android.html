<!doctype html>
<!--
  fixture 语义等价样本：OD 仓 .../prototype/device-frames/android.html
  （0.25.1 检出，2026-11-09）。语义等价形态同 iphone.html：来源注释 + .phone-content
  应用内容槽 + 无应用排版约束；外形按 Android 壳语义（无刘海、三键导航区）。
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Android mobile prototype</title>
  <style>
    :root {
      --phone-screen-width: 412px;
      --phone-screen-height: 915px;
      --phone-screen-bg: #ffffff;
      --phone-stage-bg: #e6e8eb;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--phone-stage-bg, #e6e8eb);
    }
    .phone {
      width: calc(var(--phone-screen-width) + 20px);
      border-radius: 36px;
      padding: 10px;
      background: #1c1e22;
    }
    .phone-content {
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      border-radius: 26px;
      overflow: auto;
      background: var(--phone-screen-bg, #ffffff);
    }
    .nav-bar {
      display: flex;
      justify-content: center;
      gap: 48px;
      padding: 10px 0;
      background: #1c1e22;
    }
    .nav-bar span { width: 14px; height: 14px; border-radius: 50%; background: #4a4d55; }
  </style>
</head>
<body>
  <section class="phone" aria-label="Android shell">
    <div class="phone-content">
      <!-- APP CONTENT SLOT：原型产物内容注入此槽 -->
    </div>
    <div class="nav-bar" aria-hidden="true"><span></span><span></span><span></span></div>
  </section>
</body>
</html>

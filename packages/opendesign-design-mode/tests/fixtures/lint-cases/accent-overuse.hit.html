<!doctype html>
<!-- fixture：accent-overuse 命中样例（style 块外 7 处 var(--accent) > 阈值 6），语义样例按上游阈值边界构造 -->
<html>
  <style>
    :root { --accent: #2f6feb; }
  </style>
  <body>
    <p style="color: var(--accent)">a</p>
    <p style="color: var(--accent)">b</p>
    <p style="color: var(--accent)">c</p>
    <p style="border-color: var(--accent)">d</p>
    <p style="outline-color: var(--accent)">e</p>
    <p style="background: var(--accent)">f</p>
    <p style="fill: var(--accent)">g</p>
  </body>
</html>

<!doctype html>
<!--
  fixture 语义等价样本：OD 仓 .../prototype/device-frames/neutral.html
  （0.25.1 检出，2026-11-09）。语义等价形态同 iphone.html；neutral 壳语义 =
  未指明平台的手机应用默认壳（无品牌特征外形）。
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neutral mobile prototype</title>
  <style>
    :root {
      --phone-screen-width: 400px;
      --phone-screen-height: 860px;
      --phone-screen-bg: #fafafa;
      --phone-stage-bg: #e8e8ea;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: var(--phone-stage-bg, #e8e8ea);
    }
    .phone {
      width: calc(var(--phone-screen-width) + 20px);
      border-radius: 44px;
      padding: 10px;
      background: #26282c;
    }
    .phone-content {
      width: var(--phone-screen-width);
      height: var(--phone-screen-height);
      border-radius: 34px;
      overflow: auto;
      background: var(--phone-screen-bg, #fafafa);
    }
  </style>
</head>
<body>
  <section class="phone" aria-label="Neutral phone shell">
    <div class="phone-content">
      <!-- APP CONTENT SLOT：原型产物内容注入此槽 -->
    </div>
  </section>
</body>
</html>

# workspace 包清单：仓根是 tai-ji-yang-shell，功能型子包逐个落 packages/<name>/（各自
# 独立 package.json / cordis.patch.yml / lib 产物）。检查与构建脚本按本清单逐包枚举。
# '.' 必须显式列出：changesets 的包识别（@manypkg/get-packages）只按本清单通配展开，
# 不含根包——而根包是发布物，缺了这行 changeset 会报「package 不在 workspace」。
packages:
  - '.'
  - 'packages/*'

# pnpm 11 起，包级设置的家从 package.json 的 "pnpm" 字段迁到本文件。
# esbuild 的平台二进制由 optionalDependencies 直接提供（postinstall 只是冗余校验），
# 但 pnpm ≥10 默认拦下安装脚本并让 `pnpm install` 以非零退出——克隆本仓按 README
# 走「pnpm install → node scripts/build-client.mjs」的用户会每次都撞一次。
# 预声明放行使该流程干净通过；esbuild 无副作用安装脚本，放行不扩大信任面。
allowBuilds:
  esbuild: true

# DSH 由宿主提供，不能因 peer 自动安装把整套宿主运行时拉进插件开发环境。
# 测试真正使用的 Cordis 与 Schemastery 已在 devDependencies 显式声明。
autoInstallPeers: false
